spring:
  application:
    name: jobTrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobtrack}
    username: ${DB_USERNAME:jobtrack}
    password: ${DB_PASSWORD:jobtrack}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
